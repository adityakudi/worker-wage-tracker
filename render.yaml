# Free prototype infrastructure only. Both resources share a private region.
services:
  - type: web
    name: worker-wage-tracker
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    autoDeployTrigger: checksPass
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: worker-wage-tracker-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
databases:
  - name: worker-wage-tracker-db
    plan: free
    region: singapore
    postgresMajorVersion: '16'
    ipAllowList: []
