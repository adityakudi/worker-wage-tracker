name: Verify API and frontend
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tracker
          POSTGRES_PASSWORD: integration-only-password
          POSTGRES_DB: tracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://tracker:integration-only-password@localhost:5432/tracker_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install API test dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Run unit and real PostgreSQL integration checks
        run: python -m unittest discover -s backend/tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        run: npm ci --prefix frontend && npm run build --prefix frontend
        env:
          VITE_API_BASE_URL: /api
      - name: Build production container
        run: docker build -t worker-wage-tracker:verify .
      - name: Boot production container against disposable PostgreSQL
        run: >-
          docker run -d --name tracker-verify --network host
          -e DATABASE_URL="$TEST_DATABASE_URL"
          -e JWT_SECRET="container-integration-only-secret-at-least-32-characters"
          -e PORT=8080 worker-wage-tracker:verify
      - name: Wait for database-connected health
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/health; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Exercise production image over HTTP
        run: python scripts/smoke_deployment.py --url http://127.0.0.1:8080 --exercise-api
      - name: Restart image and verify migration replay and readiness
        run: |
          docker restart tracker-verify
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/health; then
              python scripts/smoke_deployment.py --url http://127.0.0.1:8080
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Container diagnostics and cleanup
        if: always()
        run: |
          docker logs tracker-verify || true
          docker rm -f tracker-verify || true
